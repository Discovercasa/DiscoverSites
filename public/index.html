<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub</title>
<link rel="canonical" href="https://hub.discovercasa.pt/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --tinta: #1d2b3a;
    --papel: #eef2f1;
    --superficie: #ffffff;
    --linha: #c9d4d2;
    --suave: #5b6b78;
    --destaque: #2e6f62;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --tinta: #e4ecea; --papel: #141c22; --superficie: #1c262e;
      --linha: #2f3d47; --suave: #93a4ae; --destaque: #6fc1ad;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --tinta: #e4ecea; --papel: #141c22; --superficie: #1c262e;
    --linha: #2f3d47; --suave: #93a4ae; --destaque: #6fc1ad;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--papel); color: var(--tinta);
    font: 1.0625rem/1.55 "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  main { width: min(100% - 2.5rem, 44rem); margin: 0 auto; padding: 3.5rem 0 2rem; flex: 1; }
  h1 { font-size: clamp(2.6rem, 9vw, 4.2rem); line-height: 1; margin: 0 0 .75rem; letter-spacing: -.02em; }
  .intro { color: var(--suave); max-width: 34rem; margin: 0 0 2.5rem; }
  .estado {
    display: flex; gap: .75rem; align-items: center;
    border-left: 4px solid var(--destaque); background: var(--superficie);
    padding: 1rem 1.25rem; border-radius: 0 10px 10px 0; margin-bottom: 2.5rem;
  }
  .ponto { width: .7rem; height: .7rem; border-radius: 50%; background: var(--suave); flex: none; }
  .ponto.ok { background: var(--destaque); }
  h2 { font-size: 1.25rem; margin: 0 0 1rem; }
  .novidade { border-top: 1px solid var(--linha); padding: 1rem 0; }
  .novidade h3 { margin: 0 0 .5rem; font-size: 1rem; }
  .novidade h3 span { color: var(--suave); font-weight: 400; margin-left: .5rem; }
  .novidade h4 { margin: .5rem 0 .25rem; font-size: .9rem; color: var(--suave); font-weight: 400; }
  .novidade ul { margin: 0; padding-left: 1.2rem; }
  footer { width: min(100% - 2.5rem, 44rem); margin: 0 auto; padding: 1.5rem 0 2rem; color: var(--suave); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Hub</h1>
  <p class="intro">Ponto de partida. As funcionalidades chegam versão a versão — vê o que mudou em baixo.</p>

  <div class="estado" role="status">
    <span class="ponto" id="ponto"></span>
    <span id="estado-texto">A verificar a ligação à plataforma…</span>
  </div>

  <section aria-labelledby="t-novidades">
    <h2 id="t-novidades">Novidades</h2>
    <div id="novidades"></div>
  </section>
</main>
<footer>Versão <span id="versao"></span></footer>

<!--
  plataforma-core: fornece o cliente Supabase com a chave PÚBLICA.
  Quando estiver definido, carregar aqui, por exemplo:
  <script src="URL-DO-PLATAFORMA-CORE"></script>
-->

<script>
  const APP_VERSAO = 'v0.0b';

  // Mais recente primeiro. A primeira entrada tem de ser igual a APP_VERSAO.
  const NOVIDADES = [
    {
      versao: 'v0.0b',
      data: '2026-10-08',
      novas: [],
      alteracoes: [
        'O Hub passa a estar em hub.discovercasa.pt.'
      ]
    },
    {
      versao: 'v0.0a',
      data: '2026-10-08',
      novas: [],
      alteracoes: [
        'O Hub passa a estar em home.discovercasa.pt.'
      ]
    },
    {
      versao: 'v0.0',
      data: '2026-10-08',
      novas: [
        'Primeira versão do Hub.',
        'Lista de novidades em cada versão.'
      ],
      alteracoes: []
    }
  ];

  document.getElementById('versao').textContent = APP_VERSAO;

  const lista = document.getElementById('novidades');
  for (const n of NOVIDADES) {
    const bloco = document.createElement('article');
    bloco.className = 'novidade';
    const grupos = [
      [n.novas, n.novas.length === 1 ? '1 nova funcionalidade' : n.novas.length + ' novas funcionalidades'],
      [n.alteracoes, n.alteracoes.length === 1 ? '1 alteração' : n.alteracoes.length + ' alterações']
    ].filter(([itens]) => itens.length);
    const h3 = document.createElement('h3');
    h3.textContent = n.versao;
    const data = document.createElement('span');
    data.textContent = n.data;
    h3.append(data);
    bloco.append(h3);
    for (const [itens, titulo] of grupos) {
      const h4 = document.createElement('h4');
      h4.textContent = titulo;
      const ul = document.createElement('ul');
      for (const t of itens) { const li = document.createElement('li'); li.textContent = t; ul.append(li); }
      bloco.append(h4, ul);
    }
    lista.append(bloco);
  }

  // Estado da ligação ao plataforma-core (ainda não ligado na v0.0).
  const ligado = typeof window.PlataformaCore !== 'undefined';
  document.getElementById('ponto').classList.toggle('ok', ligado);
  document.getElementById('estado-texto').textContent = ligado
    ? 'Ligado à plataforma.'
    : 'Ainda sem ligação à plataforma. Chega na v0.1.';
</script>
</body>
</html>
